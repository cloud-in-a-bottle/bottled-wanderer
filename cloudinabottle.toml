[app]
name = "wanderer"
version = "0.1.0"
description = "Plots every GPS route from your workouts on a single map"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
memory_mb = 256
cpu_millicores = 200

[data]
# Caches each workout's downsampled route so we don't refetch on every load.
sqlite = ["routes"]

[[services.v2.consumes]]
service = "github.com/imbue-openhost/health-data-service-spec"
shortname = "health"
version = ">=0.1.0"
grants = ["full_access"]
