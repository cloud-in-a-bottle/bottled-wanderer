[project]
name = "wanderer"
version = "0.1.0"
description = "Plots every GPS route from your workouts on a single map"
requires-python = "==3.12.*"
dependencies = [
    "litestar>=2.12",
    "hypercorn>=0.17",
    "attrs>=24.0",
    "loguru>=0.7.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "health-data-service",
]

[tool.uv.sources]
health-data-service = { git = "https://github.com/imbue-openhost/health-data-service-spec", branch = "main" }

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest>=8.0",
    "pytest-playwright",
    "playwright",
    "httpx>=0.27",
    # Builds the app's Dockerfile, runs it under podman with the mounts/env its
    # openhost.toml declares, and fronts it with a mock router. Requires podman.
    "openhost-test-harness @ git+https://github.com/imbue-openhost/openhost-app-test-harness@main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanderer"]

[tool.pytest.ini_options]
addopts = "-v"

[tool.ruff]
line-length = 119
exclude = [
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (modern Python syntax)
    "I",      # isort
    "PLC0415", # import-outside-top-level
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
known-first-party = [
    "wanderer",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["wanderer"]
strict = true
ignore_missing_imports = true
exclude = []
